name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
      - run: npm run test
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000/api

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hospital-backend/package-lock.json
      - run: npm ci
        working-directory: hospital-backend
      - run: npm test
        working-directory: hospital-backend
        env:
          JWT_SECRET: ci_test_secret_key_minimum_32_chars
          JWT_EXPIRE: 1h
