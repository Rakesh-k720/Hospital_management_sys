services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: hospital_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./hms_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  backend:
    build: ./hospital-backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASS: rootpass
      DB_NAME: hospital_db
      JWT_SECRET: change_me_in_production
      JWT_EXPIRE: 7d
      PORT: 5000
    depends_on:
      - mysql
    volumes:
      - ./hospital-backend/uploads:/app/uploads

  frontend:
    build: .
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
